<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-fed">Fed</span><span class="logo-e">E</span>
      <span class="logo-subtitle">Proactive AI Assistant</span>
    </div>
    <div class="header-actions">
      <button class="voice-btn" (click)="openVoice()" title="Voice Assistant">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
        Speak
      </button>
      <app-login />
    </div>
  </div>
</header>

<nav class="nav-tabs">
  <button [class.active]="activeTab() === 'track'" (click)="setTab('track')">
    Track
  </button>
  <button [class.active]="activeTab() === 'chat'" (click)="setTab('chat')">
    Ask FedE
  </button>
  <button [class.active]="activeTab() === 'actions'" (click)="setTab('actions')">
    Actions
  </button>
  <button [class.active]="activeTab() === 'notifications'" (click)="setTab('notifications')">
    Notifications
  </button>
</nav>

<main class="main-content">
  @if (activeTab() === 'track') {
    <app-tracking />
  }
  @if (activeTab() === 'chat') {
    <app-chat />
  }
  @if (activeTab() === 'actions') {
    <app-actions />
  }
  @if (activeTab() === 'notifications') {
    <app-notifications />
  }
</main>

<app-voice-sidebar #voiceSidebar />
